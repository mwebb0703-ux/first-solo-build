<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo build Megan</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://kit.fontawesome.com/36c3839282.js" crossorigin="anonymous"></script>
  <script src="index.js"></script>
</head>
<body>

  <section ID="landing">
    <nav class="nav__container">
      <div class="nav__row">
        <figure class="nav__logo">
          <img class="nav__logo--img" src="assets/Treact logo.svg" alt="Treact logo">
        </figure>
        <div class="nav__logo--title">
          Treact
        </div>
        <ul class="nav__links">
          <li><a href="#" class="nav__link">About</a></li>
          <li><a href="#" class="nav__link">Blog</a></li>
          <li><a href="#" class="nav__link">Pricing</a></li>
          <li><a href="#" class="nav__link">Contact Us</a></li>
          <li><a href="#" class="nav__link nav__link--login">Login</a></li>
          <li class="nav__link--primary"><button class="nav__btn--signup"> Sign Up </button></li>
        </ul>
      </div>
    </nav>
    <header>
      <div class="container">
        <div class="row">
          <div class="header__description">
            <h1>
              Beautiful React Templates <span class="purple">for you</span>.
            </h1>
            <p class="header__description--para">
              0ur templates are easy to setup, understand and customize. Fully modular components with a variety of pages and components.
            </p>
              <div class="header__email">
                <input type="email" class="header__email--input" placeholder="Your Email Address">
                <button class="header__email--btn">Get Started</button>
              </div>
              <p class="headder__customers--title">OUR TRUSTED CUSTOMERS</p>
              <img src="assets/customers-logo-strip.680ac7c2e8ae28161d2c.png" class="header__customers" alt="trusted customer logos">
          </div>
          <figure class="header__img--wrapper">
            <img src="assets/Picture for website.svg" class="header__img" alt="person working at a computer">
          </figure>
        </div>
      </div>
    </header>
  </section>
  <section>
    <div id="">

    </div>
  </section>
</body>
</html>
